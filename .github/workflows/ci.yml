name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  test:
    name: Simulation tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test RTS.sln --logger "console;verbosity=normal"

  determinism:
    name: Determinism check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run a 10-minute match twice and compare hashes
        run: bash scripts/determinism.sh build/determinism
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true # a full artifact store must not fail the check
        with:
          name: determinism-${{ github.sha }}
          path: build/determinism
          retention-days: 7

  ai-matches:
    name: AI matches
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Computer players win five matches within 40 minutes, and each replays the same
        run: bash scripts/ai-matches.sh build/ai-matches
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ai-matches-${{ github.sha }}
          path: build/ai-matches
          retention-days: 7

  ui-list:
    name: Find UI screenshot tests
    runs-on: ubuntu-24.04
    outputs:
      scripts: ${{ steps.find.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - name: List the UI scripts, leaving out any with a CI skip line
        id: find
        run: |
          names=$(grep -L '^# CI: skip' scripts/ui-*.sh | sed 's|scripts/||; s|\.sh$||' | sort)
          echo "$names"
          echo "scripts=$(echo "$names" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  # One job per UI script, all at once. A new scripts/ui-*.sh is picked up without editing this file;
  # add a "# CI: skip" line to its header to leave it out.
  ui-script:
    name: UI ${{ matrix.script }}
    runs-on: ubuntu-24.04
    needs: [test, ui-list]
    strategy:
      fail-fast: false # every script reports, not just the first to fail
      matrix:
        script: ${{ fromJSON(needs.ui-list.outputs.scripts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux
      - name: Install Godot and a virtual screen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1 libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6
          GODOT_DIR="$HOME/godot" BIN_DIR="$HOME/.local/bin" bash scripts/setup.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run ${{ matrix.script }}.sh with scripted input
        run: bash scripts/${{ matrix.script }}.sh build/ui/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ui-${{ matrix.script }}-${{ github.sha }}
          path: build/ui
          retention-days: 3

  # Keeps one "UI screenshot test" check that passes only when every UI script passed, and gathers their
  # screenshots into one ui-screenshots-<sha> artifact, one folder per script.
  ui-screenshots:
    name: UI screenshot test
    runs-on: ubuntu-24.04
    needs: [ui-list, ui-script]
    if: always()
    steps:
      # Screenshots are about 30 MB a run: kept three days, long enough to look at a PR's.
      - uses: actions/upload-artifact/merge@v4
        if: needs.ui-script.result != 'skipped'
        continue-on-error: true
        with:
          name: ui-screenshots-${{ github.sha }}
          pattern: ui-*-${{ github.sha }}
          delete-merged: true
          retention-days: 3
      - name: Every UI script passed
        run: |
          echo "find: ${{ needs.ui-list.result }}, scripts: ${{ needs.ui-script.result }}"
          [ "${{ needs.ui-list.result }}" = success ] && [ "${{ needs.ui-script.result }}" = success ]

  windows-build:
    name: Windows build
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-win
      - name: Install Godot
        run: |
          GODOT_DIR="$HOME/godot" BIN_DIR="$HOME/.local/bin" bash scripts/setup.sh --with-export-templates
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Export Windows build
        run: bash scripts/export-windows.sh
      # The Windows build is about 75 MB: PRs only check that it exports, and builds of develop and main
      # (the ones worth playing) are kept a week.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: RTS-windows-${{ github.sha }}
          path: build/windows
          retention-days: 7
