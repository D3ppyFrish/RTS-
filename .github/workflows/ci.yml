name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  test:
    name: Simulation tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test RTS.sln --logger "console;verbosity=normal"

  determinism:
    name: Determinism check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run a 10-minute match twice and compare hashes
        run: bash scripts/determinism.sh build/determinism
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true # a full artifact store must not fail the check
        with:
          name: determinism-${{ github.sha }}
          path: build/determinism
          retention-days: 7

  ai-matches:
    name: AI matches
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Computer players win five matches within 40 minutes, and each replays the same
        run: bash scripts/ai-matches.sh build/ai-matches
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ai-matches-${{ github.sha }}
          path: build/ai-matches
          retention-days: 7

  ui-screenshots:
    name: UI screenshot test
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux
      - name: Install Godot and a virtual screen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1 libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6
          GODOT_DIR="$HOME/godot" BIN_DIR="$HOME/.local/bin" bash scripts/setup.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Select units, pause and cut a hill with scripted input
        run: bash scripts/ui-screenshots.sh build/ui
      - name: Gather, research, build a house, train and lay a road with scripted input
        run: bash scripts/ui-economy-screenshots.sh build/ui
      - name: Fight a battle and tunnel under a house with scripted input
        run: bash scripts/ui-combat-screenshots.sh build/ui
      - name: Automatic workers, repeating training and an automatic house with scripted input
        run: bash scripts/ui-automation-screenshots.sh build/ui
      - name: Evolve units with the evolve and auto-evolve buttons with scripted input
        run: bash scripts/ui-evolution-screenshots.sh build/ui
      - name: Clear wolf lairs as the Orcs (ride and recruit) and the Settlers (reward) with scripted input
        run: bash scripts/ui-monsters-screenshots.sh build/ui
      - name: Win the goblin town with gifts, hire goblins and trade with a caravan with scripted input
        run: bash scripts/ui-citystate-screenshots.sh build/ui
      - name: Start a match from the start screen, surrender, replay it, and win one with scripted input
        run: bash scripts/ui-match-screenshots.sh build/ui
      - name: Fog of war, switched on the start screen, hides the enemy until your army sees it, with scripted input
        run: bash scripts/ui-fog-screenshots.sh build/ui
      - name: Dig out an area with workers and sappers using the dig tool, with scripted input
        run: bash scripts/ui-dig-screenshots.sh build/ui
      - name: A ledge dug free falls, comes down in dust and leaves rubble, with scripted input
        run: bash scripts/ui-physics-screenshots.sh build/ui
      - name: Alerts for a finished house and an attack move the camera, and the idle workers button, with scripted input
        run: bash scripts/ui-alerts-screenshots.sh build/ui
      - name: Right-drag a line that the army forms up along, then move it keeping its shape, with scripted input
        run: bash scripts/ui-formation-screenshots.sh build/ui
      - name: Place a gate, draw a wall through it and watch the workers build it, with scripted input
        run: bash scripts/ui-wall-screenshots.sh build/ui
      - name: Draw a bridge across a river and watch the workers lay its deck, with scripted input
        run: bash scripts/ui-bridge-screenshots.sh build/ui
      - name: Two armies fight and wounded units bleed, leaving trails and pools, with scripted input
        run: bash scripts/ui-blood-screenshots.sh build/ui
      - name: Test mode places trees, water, lava, units, a building, a lair and blood, sets cheats, weather and time, saves and loads a scenario, with scripted input
        run: bash scripts/ui-test-mode-screenshots.sh build/ui
      - name: The start screen, HUD, tech tree and end of match panel in each UI look, with scripted input
        run: bash scripts/ui-style-screenshots.sh build/ui/style
      - name: The world lit at morning, noon, dusk and night, and kept day with the time of day button, with scripted input
        run: bash scripts/ui-daynight-screenshots.sh build/ui/daynight
      # Screenshots are about 30 MB a run: kept three days, long enough to look at a PR's.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ui-screenshots-${{ github.sha }}
          path: build/ui
          retention-days: 3

  windows-build:
    name: Windows build
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-win
      - name: Install Godot
        run: |
          GODOT_DIR="$HOME/godot" BIN_DIR="$HOME/.local/bin" bash scripts/setup.sh --with-export-templates
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Export Windows build
        run: bash scripts/export-windows.sh
      # The Windows build is about 75 MB: PRs only check that it exports, and builds of develop and main
      # (the ones worth playing) are kept a week.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: RTS-windows-${{ github.sha }}
          path: build/windows
          retention-days: 7
